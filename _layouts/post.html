---
layout: default
---

<nav class="post-nav">
  <a href="{{ '/' | relative_url }}">← return /home</a>
</nav>

<article class="post-content">
  <h1>{{ page.title }}</h1>

  <p class="post-meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.tags %}
      · {% for tag in page.tags %}#{{ tag }} {% endfor %}
    {% endif %}
  </p>

  {{ content }}
</article>
